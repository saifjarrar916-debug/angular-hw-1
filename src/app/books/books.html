<div class="flex w-full bg-slate-900 justify-between">
    <h1 class="font-mono font-bold text-3xl text-green-300  hover:text-red-400 transition-colors duration-500">BooksApp</h1>
    <h1 routerLink="/books" class="font-mono font-bold text-3xl  text-green-300  hover:text-red-400 transition-colors duration-500">Home</h1>
</div>

<div class="flex flex-col justify-center items-center min-h-screen bg-slate-700 w-full h-full  pt-5 ">
<ul class="font-extrabold text-3xl">
  @for (book of books; track book.id) {
   <div class="bg-slate-50  mb-3 h-48 rounded-md shadow-lg shadow-emerald-400">
    <li class="pb-8 cursor-pointer hover:text-emerald-700 hover: font-sans transition-all duration-500">
  
        {{ book.title }} - {{ book.author }}
      
    </li>
    <button class="border-solid  bg-zinc-500 rounded-md shadow-xl r w-5/6 ml-10 mt-10">
      <a class=" hover:text-emerald-700 transition-colors duration-500"  [routerLink]="['/books', book.id]">
       
       View Page
      </a>
     </button>
    </div>
  }
</ul>
</div>
